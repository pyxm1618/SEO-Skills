name: PR39 bounded live smoke

on:
  push:
    branches:
      - codex/emerging-radar-fix-20260912
    paths:
      - .github/workflows/pr39-bounded-live-smoke.yml

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install live collector dependency
        run: python -m pip install --upgrade pip playwright
      - name: Start isolated logged-out Chrome CDP
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          rm -rf /tmp/seo-google-profile
          mkdir -p /tmp/seo-google-profile
          xvfb-run -a "$CHROME" \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/seo-google-profile \
            --no-first-run \
            --no-default-browser-check \
            --disable-sync \
            --no-sandbox \
            about:blank >/tmp/pr39-chrome.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9222/json/version >/tmp/pr39-cdp.json; then
              cat /tmp/pr39-cdp.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pr39-chrome.log || true
          exit 1
      - name: Diagnose actual Google Trends page activity
        env:
          SEO_GOOGLE_CDP_URL: http://127.0.0.1:9222
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.parse import parse_qs, quote_plus, urlparse
          from playwright.sync_api import sync_playwright

          target = (
              "https://trends.google.com/trends/explore?"
              f"geo=US&date={quote_plus('today 12-m')}&q={quote_plus('perfume')}"
          )

          def summarize_url(url):
              parsed = urlparse(url)
              item = {"host": parsed.hostname, "path": parsed.path}
              if parsed.hostname == "trends.google.com" and "/trends/api/" in parsed.path:
                  query = parse_qs(parsed.query)
                  req = query.get("req", [None])[0]
                  if req:
                      try:
                          req = json.loads(req)
                      except Exception:
                          pass
                  item["req"] = req
                  item["token_present"] = bool(query.get("token"))
              return item

          def probe(label, context):
              page = context.new_page()
              requests = []
              failed = []
              console_errors = []
              page_errors = []

              def on_request(request):
                  host = urlparse(request.url).hostname or ""
                  if "google" in host or "gstatic" in host:
                      requests.append(summarize_url(request.url))

              def on_failed(request):
                  failed.append({"url": request.url, "failure": request.failure})

              def on_console(message):
                  if message.type in {"error", "warning"}:
                      console_errors.append({"type": message.type, "text": message.text[:1000]})

              page.on("request", on_request)
              page.on("requestfailed", on_failed)
              page.on("console", on_console)
              page.on("pageerror", lambda exc: page_errors.append(str(exc)[:2000]))
              page.goto(target, wait_until="domcontentloaded", timeout=30_000)
              page.wait_for_timeout(15_000)
              body = ""
              try:
                  body = page.locator("body").inner_text(timeout=5_000)
              except Exception as exc:
                  body = f"BODY_READ_FAILED: {exc}"
              print(f"PROBE_{label}_URL", page.url)
              print(f"PROBE_{label}_TITLE", page.title())
              print(f"PROBE_{label}_BODY", body[:6000].replace("\n", " | "))
              print(f"PROBE_{label}_REQUESTS", json.dumps(requests[:120], ensure_ascii=False))
              print(f"PROBE_{label}_FAILED", json.dumps(failed[:50], ensure_ascii=False))
              print(f"PROBE_{label}_CONSOLE", json.dumps(console_errors[:50], ensure_ascii=False))
              print(f"PROBE_{label}_PAGE_ERRORS", json.dumps(page_errors[:50], ensure_ascii=False))
              print(f"PROBE_{label}_SCRIPT_COUNT", page.locator("script").count())
              page.close()

          with sync_playwright() as p:
              browser = p.chromium.connect_over_cdp(os.environ["SEO_GOOGLE_CDP_URL"])
              print("BROWSER_CONTEXT_COUNT", len(browser.contexts))
              probe("DEDICATED", browser.contexts[0])
              isolated = browser.new_context()
              try:
                  probe("ISOLATED", isolated)
              finally:
                  isolated.close()
          PY
      - name: Run hard-capped real Radar smoke on dedicated logged-out profile
        env:
          SEO_GOOGLE_CDP_URL: http://127.0.0.1:9222
        run: |
          set +e
          rm -rf .seo-run/pr39-live-smoke
          python3 skills/emerging-keyword-monitor/scripts/run_emerging_radar.py \
            --domain perfume \
            --anchor perfume \
            --country US \
            --language en \
            --max-depth 1 \
            --per-anchor-limit 2 \
            --max-candidates 2 \
            --max-total-candidates 1 \
            --max-collection-retries 0 \
            --max-consecutive-collection-failures 1 \
            --run-dir .seo-run/pr39-live-smoke \
            --output .seo-run/pr39-live-smoke/run-summary.json \
            > /tmp/pr39-smoke.stdout 2> /tmp/pr39-smoke.stderr
          rc=$?
          echo "SMOKE_EXIT=$rc"
          cat /tmp/pr39-smoke.stdout || true
          cat /tmp/pr39-smoke.stderr || true
          if [ -f .seo-run/pr39-live-smoke/run-summary.json ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('.seo-run/pr39-live-smoke/run-summary.json')
          data = json.loads(p.read_text())
          ledger = data.get('candidate_ledger') or []
          attempted = [r for r in ledger if r.get('acquisition_status') not in {'not_attempted','not_applicable','not_started'}]
          overflow = [r for r in ledger if r.get('acquisition_reason') == 'batch_candidate_limit']
          print(json.dumps({
              'status': data.get('status'),
              'ledger_count': len(ledger),
              'attempted_candidate_count': len(attempted),
              'overflow_count': len(overflow),
              'delivery_ids': (data.get('reconciliation') or {}).get('delivery_ids'),
              'blockers': data.get('blockers'),
          }, ensure_ascii=False, indent=2))
          if len(attempted) > 1:
              raise SystemExit('hard cap violated: more than one candidate attempted')
          PY
          fi
          exit "$rc"
