name: PR39 bounded live smoke

on:
  push:
    branches:
      - codex/emerging-radar-fix-20260912
    paths:
      - .github/workflows/pr39-bounded-live-smoke.yml

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install live collector dependency
        run: python -m pip install --upgrade pip playwright pytest

      - name: Start dedicated logged-out Chrome for Related
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          rm -rf /tmp/seo-google-related-profile
          mkdir -p /tmp/seo-google-related-profile
          xvfb-run -a "$CHROME" \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/seo-google-related-profile \
            --no-first-run \
            --no-default-browser-check \
            --disable-sync \
            --no-sandbox \
            about:blank >/tmp/pr39-related-chrome.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9222/json/version >/tmp/pr39-related-cdp.json; then
              cat /tmp/pr39-related-cdp.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pr39-related-chrome.log || true
          exit 1

      - name: Collect one real request-bound Related payload
        env:
          SEO_GOOGLE_CDP_URL: http://127.0.0.1:9222
        run: |
          set +e
          rm -rf /tmp/pr39-related-evidence /tmp/pr39-related.json /tmp/pr39-related.receipt.json
          python3 runtime/collectors/google_trends_collector.py trends_related \
            --keyword perfume \
            --market US \
            --timeframe 'today 12-m' \
            --evidence-dir /tmp/pr39-related-evidence \
            --output /tmp/pr39-related.json \
            >/tmp/pr39-related.stdout 2>/tmp/pr39-related.stderr
          rc=$?
          echo "RELATED_EXIT=$rc"
          cat /tmp/pr39-related.stdout || true
          cat /tmp/pr39-related.stderr || true
          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('/tmp/pr39-related.json')
          data = json.loads(path.read_text())
          assert data['verification_status'] == 'verified'
          assert data['request_binding_status'] == 'verified'
          assert data['screenshot_status'] == 'captured'
          assert isinstance(data['related_queries'], list)
          receipt = Path(data['evidence_receipt_ref'])
          assert receipt.is_file(), receipt
          signed = json.loads(receipt.read_text())
          assert signed['collector'] == 'google_trends_collector'
          assert signed['evidence_type'] == 'google_trends_related'
          print(json.dumps({
              'related_query_count': len(data['related_queries']),
              'source_url': data['source_url'],
              'receipt': str(receipt),
          }, ensure_ascii=False))
          PY

      - name: Start dedicated logged-out Chrome for Timeline
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          rm -rf /tmp/seo-google-timeline-profile
          mkdir -p /tmp/seo-google-timeline-profile
          xvfb-run -a "$CHROME" \
            --remote-debugging-port=9223 \
            --user-data-dir=/tmp/seo-google-timeline-profile \
            --no-first-run \
            --no-default-browser-check \
            --disable-sync \
            --no-sandbox \
            about:blank >/tmp/pr39-timeline-chrome.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9223/json/version >/tmp/pr39-timeline-cdp.json; then
              cat /tmp/pr39-timeline-cdp.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pr39-timeline-chrome.log || true
          exit 1

      - name: Collect one real request-bound Timeline payload
        env:
          SEO_GOOGLE_CDP_URL: http://127.0.0.1:9223
        run: |
          set +e
          rm -rf /tmp/pr39-timeline-evidence /tmp/pr39-timeline.json /tmp/pr39-timeline.receipt.json
          python3 runtime/collectors/google_trends_collector.py trends_timeline \
            --keyword perfume \
            --market US \
            --timeframe 'today 12-m' \
            --evidence-dir /tmp/pr39-timeline-evidence \
            --output /tmp/pr39-timeline.json \
            >/tmp/pr39-timeline.stdout 2>/tmp/pr39-timeline.stderr
          rc=$?
          echo "TIMELINE_EXIT=$rc"
          cat /tmp/pr39-timeline.stdout || true
          cat /tmp/pr39-timeline.stderr || true
          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('/tmp/pr39-timeline.json')
          data = json.loads(path.read_text())
          assert data['verification_status'] == 'verified'
          assert data['request_binding_status'] == 'verified'
          assert data['screenshot_status'] == 'captured'
          assert data['acquisition_status'] in {'data_acquired', 'valid_no_data'}
          if data['acquisition_status'] == 'data_acquired':
              assert data['series']
              receipt = Path(data['evidence_receipt_ref'])
              assert receipt.is_file(), receipt
              signed = json.loads(receipt.read_text())
              assert signed['collector'] == 'google_trends_collector'
              assert signed['evidence_type'] == 'google_trends'
          print(json.dumps({
              'acquisition_status': data['acquisition_status'],
              'series_points': len(data.get('series') or []),
              'source_url': data['source_url'],
          }, ensure_ascii=False))
          PY

      - name: Replay real Timeline evidence through hard-capped carry-forward runner
        run: |
          python3 - <<'PY'
          import importlib.util
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path.cwd()
          script = root / 'skills' / 'emerging-keyword-monitor' / 'scripts' / 'run_emerging_radar.py'
          sys.path.insert(0, str(script.parent))
          spec = importlib.util.spec_from_file_location('pr39_live_replay', script)
          runner = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = runner
          spec.loader.exec_module(runner)

          timeline = json.loads(Path('/tmp/pr39-timeline.json').read_text())
          assert timeline['acquisition_status'] == 'data_acquired', 'strict replay requires an observed Timeline series'
          calls = []

          def fetch_timeline(keyword, timeframe):
              calls.append((keyword, timeframe))
              if keyword != 'perfume' or timeframe != 'today 12-m':
                  raise AssertionError(f'unexpected live replay request: {keyword!r} {timeframe!r}')
              return dict(timeline)

          database = {
              'schema_version': 1,
              'records': [
                  {
                      'domain': 'perfume',
                      'keyword': 'perfume',
                      'status': 'watch',
                      'observation_state': 'watching',
                      'monitoring_state': 'active',
                      'parent_anchor': 'perfume',
                      'domain_relation': 'in_scope',
                      'domain_relation_reason': 'reviewed topical anchor',
                      'first_observed_at': '2026-09-01T00:00:00+00:00',
                  },
                  {
                      'domain': 'perfume',
                      'keyword': 'perfume for men',
                      'status': 'watch',
                      'observation_state': 'watching',
                      'monitoring_state': 'active',
                      'parent_anchor': 'perfume',
                      'domain_relation': 'in_scope',
                      'domain_relation_reason': 'reviewed topical child',
                      'first_observed_at': '2026-09-01T00:00:00+00:00',
                  },
              ],
          }

          result = runner.run_pipeline(
              lambda _anchor: {'related_queries': []},
              domain='perfume',
              max_depth=0,
              max_candidates=10,
              max_total_candidates=1,
              existing_database=database,
              timeline_fetcher=fetch_timeline,
              timeframe_specs=(('12m', 'today 12-m'),),
              max_collection_retries=0,
              max_consecutive_collection_failures=1,
              as_of=datetime(2026, 9, 13, tzinfo=timezone.utc),
          )

          overflow = [row for row in result['candidate_ledger'] if row.get('acquisition_reason') == 'batch_candidate_limit']
          assert calls == [('perfume', 'today 12-m')], calls
          assert len(overflow) == 1, overflow
          assert overflow[0]['keyword'] == 'perfume for men'
          assert overflow[0]['acquisition_status'] == 'not_attempted'
          assert overflow[0]['delivery_eligible'] is False
          assert result['status'] == 'PASS', result['blockers']
          print(json.dumps({
              'status': result['status'],
              'timeline_calls': calls,
              'ledger_count': len(result['candidate_ledger']),
              'overflow': [{'keyword': r['keyword'], 'reason': r['acquisition_reason']} for r in overflow],
              'reconciliation': result['reconciliation'],
          }, ensure_ascii=False, indent=2))
          PY
