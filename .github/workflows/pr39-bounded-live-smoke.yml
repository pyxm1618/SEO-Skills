name: PR39 bounded live smoke

on:
  push:
    branches:
      - codex/emerging-radar-fix-20260912
    paths:
      - .github/workflows/pr39-bounded-live-smoke.yml

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install live collector dependency
        run: python -m pip install --upgrade pip playwright
      - name: Start isolated logged-out Chrome CDP
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          rm -rf /tmp/seo-google-profile
          mkdir -p /tmp/seo-google-profile
          xvfb-run -a "$CHROME" \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/seo-google-profile \
            --no-first-run \
            --no-default-browser-check \
            --disable-background-networking \
            --disable-sync \
            --no-sandbox \
            about:blank >/tmp/pr39-chrome.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9222/json/version >/tmp/pr39-cdp.json; then
              cat /tmp/pr39-cdp.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pr39-chrome.log || true
          exit 1
      - name: Probe actual Google Trends widget requests
        env:
          SEO_BROWSER_CDP_URL: http://127.0.0.1:9222
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.parse import parse_qs, quote_plus, urlparse
          from playwright.sync_api import sync_playwright

          target = (
              "https://trends.google.com/trends/explore?"
              f"geo=US&date={quote_plus('today 12-m')}&q={quote_plus('perfume')}"
          )
          seen = []

          def decode_request(url):
              parsed = urlparse(url)
              if parsed.hostname != "trends.google.com" or "/trends/api/" not in parsed.path:
                  return None
              query = parse_qs(parsed.query)
              req = query.get("req", [None])[0]
              decoded = None
              if req:
                  try:
                      decoded = json.loads(req)
                  except Exception:
                      decoded = req
              return {
                  "path": parsed.path,
                  "req": decoded,
                  "token_present": bool(query.get("token")),
              }

          with sync_playwright() as p:
              browser = p.chromium.connect_over_cdp(os.environ["SEO_BROWSER_CDP_URL"])
              context = browser.new_context()
              page = context.new_page()

              def on_request(request):
                  item = decode_request(request.url)
                  if item is not None:
                      seen.append(item)

              page.on("request", on_request)
              page.goto(target, wait_until="domcontentloaded", timeout=30_000)
              page.wait_for_timeout(12_000)
              for label in ("Related queries", "Related topics"):
                  try:
                      locator = page.get_by_text(label, exact=False)
                      if locator.count():
                          locator.first.scroll_into_view_if_needed(timeout=3_000)
                          break
                  except Exception:
                      pass
              page.wait_for_timeout(5_000)
              print("TRENDS_PROBE_PAGE", page.url)
              print("TRENDS_PROBE_WIDGET_REQUESTS")
              print(json.dumps(seen, ensure_ascii=False, indent=2))
              context.close()
          PY
      - name: Run hard-capped real Radar smoke
        env:
          SEO_BROWSER_CDP_URL: http://127.0.0.1:9222
        run: |
          set +e
          rm -rf .seo-run/pr39-live-smoke
          python3 skills/emerging-keyword-monitor/scripts/run_emerging_radar.py \
            --domain perfume \
            --anchor perfume \
            --country US \
            --language en \
            --max-depth 1 \
            --per-anchor-limit 2 \
            --max-candidates 2 \
            --max-total-candidates 1 \
            --max-collection-retries 0 \
            --max-consecutive-collection-failures 1 \
            --run-dir .seo-run/pr39-live-smoke \
            --output .seo-run/pr39-live-smoke/run-summary.json \
            > /tmp/pr39-smoke.stdout 2> /tmp/pr39-smoke.stderr
          rc=$?
          echo "SMOKE_EXIT=$rc"
          cat /tmp/pr39-smoke.stdout || true
          cat /tmp/pr39-smoke.stderr || true
          if [ -f .seo-run/pr39-live-smoke/run-summary.json ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('.seo-run/pr39-live-smoke/run-summary.json')
          data = json.loads(p.read_text())
          ledger = data.get('candidate_ledger') or []
          attempted = [r for r in ledger if r.get('acquisition_status') not in {'not_attempted','not_applicable','not_started'}]
          overflow = [r for r in ledger if r.get('acquisition_reason') == 'batch_candidate_limit']
          print(json.dumps({
              'status': data.get('status'),
              'ledger_count': len(ledger),
              'attempted_candidate_count': len(attempted),
              'overflow_count': len(overflow),
              'delivery_ids': (data.get('reconciliation') or {}).get('delivery_ids'),
              'blockers': data.get('blockers'),
          }, ensure_ascii=False, indent=2))
          if len(attempted) > 1:
              raise SystemExit('hard cap violated: more than one candidate attempted')
          PY
          fi
          exit "$rc"
