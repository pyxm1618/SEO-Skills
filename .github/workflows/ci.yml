name: CI

on:
  push:
    branches: [main]
  # Not restricted to PRs targeting main: work lands through stacked PRs whose
  # base is another feature branch, and those need CI before they are merged.
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Test keyword root library
        run: python3 -m pytest skills/keyword-root-library/tests/test_root_library.py -q

      - name: Test keyword selection
        run: python3 -m pytest skills/seo-keyword-selection/tests/test_selection.py -q

      - name: Test emerging keyword monitor
        run: python3 -m pytest skills/emerging-keyword-monitor/tests -q

      - name: Run repository-wide test suite
        run: python3 -m pytest -q

      - name: Compile Python sources
        run: python3 -m compileall -q skills runtime
