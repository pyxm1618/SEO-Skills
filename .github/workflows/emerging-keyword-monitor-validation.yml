name: Emerging Keyword Monitor Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Keyword root library baseline
        run: python3 -m pytest skills/keyword-root-library/tests/test_root_library.py -q
      - name: SEO keyword selection baseline
        run: python3 -m pytest skills/seo-keyword-selection/tests/test_selection.py -q
      - name: Emerging keyword monitor
        shell: bash
        run: |
          if [ -d skills/emerging-keyword-monitor/tests ]; then
            python3 -m pytest skills/emerging-keyword-monitor/tests -q
          else
            echo "emerging-keyword-monitor not present yet (baseline run)"
          fi
      - name: Repository-wide
        run: python3 -m pytest -q
