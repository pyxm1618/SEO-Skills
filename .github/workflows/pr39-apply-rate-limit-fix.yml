name: PR39 apply rate-limit fix

on:
  push:
    branches:
      - codex/emerging-radar-fix-20260912
    paths:
      - .github/pr39_rate_limit_fix.py
      - .github/workflows/pr39-apply-rate-limit-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/emerging-radar-fix-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Apply source fix
        run: python3 .github/pr39_rate_limit_fix.py
      - name: Run targeted regression
        run: python3 -m pytest tests/test_google_trends_rate_limit.py tests/test_pr39_audit_regressions.py -q
      - name: Run full suite
        run: python3 -m pytest -q
      - name: Compile sources
        run: python3 -m compileall -q skills runtime
      - name: Build clean final commit
        run: |
          git rm -f .github/pr39_rate_limit_fix.py .github/workflows/pr39-apply-rate-limit-fix.yml
          git add runtime skills tests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(trends): fail closed on Google rate limiting'
      - name: Check final diff
        run: git diff --check 645539a4c91aef66a5a715c54e12207f667f6c45...HEAD
      - name: Push verified fix
        run: git push origin HEAD:codex/emerging-radar-fix-20260912
